[package]
name = "ohttp-e2e"
version = "1.1.0"
license = "AGPL-3.0-only"
edition = "2021"

[dependencies]
# The encapsulation only: this binary sends the outer request itself.
zodl-ohttp-client = { path = "../client", default-features = false }
hex = "0.4"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2.5"

[dev-dependencies]
# The tests of the binary (tests/e2e_tool.rs) sign the envelopes their local server serves.
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
