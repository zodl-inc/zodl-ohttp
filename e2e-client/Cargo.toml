[package]
name = "ohttp-e2e"
version = "1.0.0"
license = "AGPL-3.0-only"
edition = "2021"

[dependencies]
# The encapsulation only: this binary sends the outer request itself.
zodl-ohttp-client = { path = "../client", default-features = false }
hex = "0.4"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
