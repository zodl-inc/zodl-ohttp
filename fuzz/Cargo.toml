[package]
name = "ohttp-fuzz"
version = "0.0.0"
license = "AGPL-3.0-only"
edition = "2021"
publish = false
description = "cargo-fuzz targets for the gateway's and the client's parsers"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ohttp-gateway = { path = "../gateway", features = ["fuzzing"] }
zodl-ohttp-client = { path = "../client", default-features = false }
tokio = { version = "1", features = ["rt"] }
bytes = "1"
http = "1"
ed25519-dalek = "2"
base64 = "0.22"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand_core = "0.9"
anyhow = "1"

# Not part of any other workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "gateway_chunked_request"
path = "fuzz_targets/gateway_chunked_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gateway_inner_request"
path = "fuzz_targets/gateway_inner_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gateway_grpc_frames"
path = "fuzz_targets/gateway_grpc_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gateway_outer_headers"
path = "fuzz_targets/gateway_outer_headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_chunked_response"
path = "fuzz_targets/client_chunked_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_bhttp_response"
path = "fuzz_targets/client_bhttp_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_key_config"
path = "fuzz_targets/client_key_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_signed_config"
path = "fuzz_targets/client_signed_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_outer"
path = "fuzz_targets/client_outer.rs"
test = false
doc = false
bench = false
