[package]
name = "zodl-ohttp-integrations"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2021"
authors = ["ZODL Inc."]
description = "Third-party integrations of the OHTTP gateway: route policy, credentials, request checks"
# Not published: a part of the gateway, built into its image only.
publish = false

[dependencies]
anyhow = "1.0"
# Value-source documents are JSON.
serde_json = "1.0"
# HTTP Basic credentials of the placeholder swap.
base64 = "0.22"
# The configuration file (TOML, typed with serde).
serde = { version = "1.0", features = ["derive"] }
toml = "1"
# The Ed25519 key of a signed credential (JWT per request).
ed25519-dalek = "2"
# The double SHA-256 checksum of base58check values.
sha2 = "0.10"
# Key material wiped when dropped.
zeroize = "1"
# The wallet's signature of a coinbase session request: secp256k1 ECDSA public key recovery
# (k256) and the HASH160 of the recovered key (RIPEMD-160 of its SHA-256).
k256 = { version = "0.13", default-features = false, features = ["ecdsa"], optional = true }
ripemd = { version = "0.1", optional = true }

[features]
# One feature per provider kind beyond the generic one; the gateway builds with all of them.
default = ["cmc", "coinbase", "flexa", "near", "swapkit"]
cmc = []
coinbase = ["dep:k256", "dep:ripemd"]
flexa = []
near = []
swapkit = []

[lib]
name = "zodl_ohttp_integrations"
path = "src/lib.rs"
