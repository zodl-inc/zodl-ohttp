[package]
name = "zodl-ohttp-integrations"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2021"
authors = ["ZODL Inc."]
description = "Third-party integrations of the OHTTP gateway: route policy, credentials, request checks"
# Not published: a part of the gateway, built into its image only.
publish = false

[dependencies]
anyhow = "1.0"
# Value-source documents are JSON.
serde_json = "1.0"
# HTTP Basic credentials of the placeholder swap.
base64 = "0.22"
# The configuration file (TOML, typed with serde).
serde = { version = "1.0", features = ["derive"] }
toml = "1"

[features]
# One feature per provider kind beyond the generic one; the gateway builds with all of them.
default = ["cmc", "flexa", "near", "swapkit"]
cmc = []
flexa = []
near = []
swapkit = []

[lib]
name = "zodl_ohttp_integrations"
path = "src/lib.rs"
