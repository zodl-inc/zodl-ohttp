# An example common configuration file of the gateway (--config; see CONFIG.md). Placeholder
# names and values only.
#
# The file holds the routing policy and, in [settings], the settings that are the same on every
# origin of a network (tuning, and references to the secrets they share). The per-host settings
# (addresses, stores, identity, sizing) go in the host file (host.example.toml). The gateway
# reads nothing else: a setting left out is its default. Every list entry is written in the
# grammar of the variable it stands for.
# `zodl-ohttp-gateway --config gateway.toml --host-config host.toml --check-config` checks them;
# `zodl-ohttp-gateway --export-config --host host.toml` writes the two files of an environment
# (migration; point each secret at a file before use).

schema = 1
gateway_hosts = ["gateway.example"]            # GATEWAY_HOSTS
backends_policy_default = "deny"               # BACKENDS_POLICY_DEFAULT
relay_secret_on_key_config = "require"         # RELAY_SECRET_ON_KEY_CONFIG

# Secrets: never in the file, only the file to read each from (files only).
[secrets]
prices_key = { file = "/run/secrets/prices_key" }
swap_jwt = { file = "/run/secrets/swap_jwt" }  # the file's content, without its final line break
quotes_key = { file = "/run/secrets/quotes_key" }
hpke_keys = { file = "/run/secrets/hpke_keys" }
relay_secrets = { file = "/run/secrets/relay_secrets" }
configs_signing_seed = { file = "/run/secrets/configs_signing_seed" }
cdp_key = { file = "/run/secrets/cdp_key" }    # one line: {"id": ..., "privateKey": ...}

# One BACKENDS alias per table.
[integrations.prices]
alias = "prices.example"
upstream = "https://prices-api.example"
routes = [                                     # BACKENDS_POLICY
  "GET /v1/quotes/latest",
  "GET /v1/fiat/map",
]
headers = [                                    # BACKEND_HEADERS
  { name = "X-Api-Key", value = "{secret}", secret = "prices_key" },
]
cache = [                                      # THIRD_PARTY_CACHE_ROUTES
  "GET /v1/quotes/latest@120",
  "GET /v1/fiat/map@21600",
]
rate_limit = "10/60s"                          # THIRD_PARTY_RATE_LIMITS
query_rules = [                                # THIRD_PARTY_QUERY_RULES
  "GET /v1/quotes/latest?symbol=ZEC&convert={from:fiat}",
  "GET /v1/fiat/map?",
]
read_routes = ["GET /*"]                       # REPLAY_READ_ROUTES

[integrations.swap]
alias = "swap.example"
upstream = "https://swap-api.example"
kind = "near"                                  # NEAR_ALIAS (kind = "flexa": FLEXA_ALIAS)
routes = ["GET /v0/tokens", "POST /v0/quote", "GET /v0/status"]
headers = [
  { name = "Authorization", value = "Bearer {secret}", secret = "swap_jwt" },
]
cache = ["GET /v0/tokens@300"]
read_routes = ["GET /v0/tokens", "GET /v0/status"]
rate_limit = "120/60s"

# kind = "cmc" or "swapkit": a generic alias that must carry a header credential and have a
# query rule on every route.
[integrations.quotes]
alias = "quotes.example"
upstream = "https://quotes-api.example"
kind = "swapkit"
routes = ["GET /tokens", "POST /v1/quote"]
headers = [{ name = "x-api-key", value = "{secret}", secret = "quotes_key" }]
query_rules = ["GET /tokens?provider=EXAMPLE", "POST /v1/quote?"]

[integrations.vote]
alias = "vote.example"
upstream = "https://voting.example"
routes = ["GET /*", "POST /*"]

# kind = "coinbase": the Coinbase Onramp provider (configuration file only, CONFIG.md
# "Coinbase integration"); its routes and their handling are fixed.
[integrations.onramp]
kind = "coinbase"
alias = "onramp.example"
upstream = "https://cdp-api.example"
auth = { type = "jwt_eddsa", secret = "cdp_key", ttl_secs = 120 }
redirect_url = "wallet://onramp/return"
enabled = true                                 # the kill switch
rate_limit = "30/60s"                          # the cap of POST /v1/session
status_rate_limit = "120/60s"                  # the cap of POST /v1/sell/status

[integrations.onramp.availability]
countries = { US = { buy = true, sell = true } }

# Authorities that are no alias: a gateway host, the pseudo authority `lwd` of the replay routes.
[hosts."gateway.example"]
routes = ["POST /cash.z.wallet.sdk.rpc.CompactTxStreamer/*"]

[hosts.lwd]
read_routes = [
  "POST /cash.z.wallet.sdk.rpc.CompactTxStreamer/GetLatestBlock",
  "POST /cash.z.wallet.sdk.rpc.CompactTxStreamer/GetBlock",
]
one_sided_write_routes = ["POST /cash.z.wallet.sdk.rpc.CompactTxStreamer/SendTransaction"]

# THIRD_PARTY_QUERY_VALUE_SOURCES
[value_sources.fiat]
alias = "prices.example"
route = "GET /v1/fiat/map"
pointer = "/data/*/symbol"
refresh_secs = 21600
fallback = ["EUR", "USD"]

[dynamic_hosts]
deny_cidrs = ["192.0.2.0/24", "2001:db8::/32"]   # DYNAMIC_HOSTS_DENY_CIDRS
sources = [                                    # DYNAMIC_HOST_SOURCES, one table per source
  { name = "voting", url = "https://voting.example/hosts.json", max_hosts = 40, lists = [{ pointer = "/servers", url_field = "url", routes = "GET /*,POST /*", read_routes = "GET /*" }] },
]

[host_list]
publish = "all"                                # THIRD_PARTY_HOSTS_PUBLISH
max_age_secs = 300                             # THIRD_PARTY_HOSTS_MAX_AGE_SECS

# The settings common to every origin: each key is its variable in lower case, each value typed
# (integers, numbers, true/false, strings, arrays of strings); a key left out is the variable's
# default. A secret only as a reference to a [secrets] entry.
[settings]
lwd_timeout_secs = 80                          # LWD_TIMEOUT_SECS
max_block_range = 10000                        # MAX_BLOCK_RANGE
max_inflight_upstream = 256                    # MAX_INFLIGHT_UPSTREAM
local_cache_bytes = 268435456                  # LOCAL_CACHE_BYTES
healthz_lwd_error_ratio = 0.2                  # HEALTHZ_LWD_ERROR_RATIO
prefetch_tree_state = true                     # PREFETCH_TREE_STATE
response_padding = "on"                        # RESPONSE_PADDING
replay_freshness = "enforce"                   # REPLAY_FRESHNESS
pinned_treestate_range = "1-"                  # PINNED_TREESTATE_RANGE
hpke_keys = { secret = "hpke_keys" }           # HPKE_KEYS
relay_secrets = { secret = "relay_secrets" }   # RELAY_SECRETS
configs_signing_seed_hex = { secret = "configs_signing_seed" }   # CONFIGS_SIGNING_SEED_HEX
