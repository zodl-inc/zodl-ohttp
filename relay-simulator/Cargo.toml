[package]
name = "ohttp-relay-simulator"
version = "1.0.0"
license = "AGPL-3.0-only"
edition = "2021"
authors = ["ZODL Inc."]
description = "OHTTP relay simulator for local testing"

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# HTTP server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"

# OHTTP
hpke = { version = "0.13", features = ["std", "x25519"] }
bhttp = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"
lazy_static = "1.5"

# UUID for request correlation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"
scopeguard = "1.2"
