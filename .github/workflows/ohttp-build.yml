name: OHTTP Build & Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # Release tags (vMAJOR.MINOR.PATCH[-PRERELEASE]) build nothing: the release-check and promote
  # jobs tag the images the main build of the tagged commit pushed as sha-<short> (same digest)
  # with the version, see scripts/promote-image.sh. Branch and pull request runs never promote.
  # Repository secrets, so that the registry, the push role and the region stay out of the logs.
  # Pull requests from forks get no secrets: their images are built but never pushed, under a
  # placeholder registry name.
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY || 'registry.invalid' }}
  # The build summary and the build record artifact of build-push-action carry the full image
  # names, outside the log masking.
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  test:
    name: Test
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    outputs:
      # buildStartedOn of the provenance attestation: the time the first step of this job, the
      # first job of the run, began (the build jobs start after it).
      started: ${{ steps.started.outputs.started }}
    # The gateway's store-backed tests (replay peers, async replication, cache, the chain
    # follower's fence scripts, the pinned tier) run against this service. Without it they fail
    # (`store::test_support::store_policy`); the opt-out OHTTP_TEST_ALLOW_NO_STORE=1 for local
    # runs is ignored when `CI` is set, so a missing service cannot pass them silently.
    services:
      redis:
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Record the start time
        id: started
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Signing, verification and the release path (which runs only on a tag push), against a
      # fake registry with stub tools and throwaway signing keys: no network, no secrets.
      - name: Test verify-image
        run: bash scripts/verify-image-test.sh

      - name: Test sign-image
        run: bash scripts/sign-image-test.sh

      - name: Test publish-index
        run: bash scripts/publish-index-test.sh

      - name: Test promote-image (release tag checks, promotion)
        run: bash scripts/promote-image-test.sh

      - name: Start the failover test stores (Redis primary + replica)
        run: docker compose -f gateway/tests/failover/docker-compose.yml up -d --wait

      - name: Test gateway
        working-directory: gateway
        env:
          # tests/store_failover.rs: promotion of a real replica under a WRITE load.
          OHTTP_FAILOVER_REDIS: "1"
        run: cargo test --locked

      - name: Integrations (fmt, clippy, tests)
        working-directory: integrations
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --no-default-features --all-targets -- -D warnings
          for feature in cmc swapkit; do
            cargo clippy --locked --no-default-features --features "$feature" --all-targets -- -D warnings
          done
          cargo test --locked
          cargo test --locked --no-default-features

      - name: Test relay-simulator
        working-directory: relay-simulator
        run: cargo test --locked

      - name: Client (fmt, clippy, tests)
        working-directory: client
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --no-default-features --all-targets -- -D warnings
          cargo clippy --locked --all-features --all-targets -- -D warnings
          cargo test --locked
          # The tests against a local gateway use the unsigned source (insecure-plain-key-config).
          cargo test --locked --all-features

      # The crate as crates.io would get it: its own tests must pass without the rest of the
      # repository (the gateway dev-dependency is stripped, the gateway tests are excluded).
      - name: Client (packaged crate tests)
        working-directory: client
        run: |
          cargo package --locked --no-verify
          unpacked="$RUNNER_TEMP/client-package"
          mkdir -p "$unpacked"
          tar -xzf target/package/zodl-ohttp-client-*.crate -C "$unpacked"
          cd "$unpacked"/zodl-ohttp-client-*/
          # The lock file cargo package wrote for the crate (dev-dependency on the gateway
          # stripped): the published crate's tests run on exactly the versions it resolved.
          cargo test --locked
          cargo test --locked --all-features

      - name: Build and test e2e-client
        working-directory: e2e-client
        run: |
          cargo build --locked
          cargo test --locked

  # One build per image and platform, each on a runner of its own architecture (no emulation: Rust
  # builds under QEMU are many times slower). A push build pushes every platform image by digest
  # only, without a tag; the publish job below tags the multi-platform index once.
  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.arch.suffix }})
    runs-on: ${{ matrix.arch.runner }}
    needs: test
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: ohttp-gateway
            short: gateway
            context: .
            file: ./gateway/Dockerfile
          - name: ohttp-relay-simulator
            short: relay-simulator
            context: ./relay-simulator
            file: ./relay-simulator/Dockerfile
          - name: ohttp-e2e
            short: e2e
            context: .
            file: ./e2e-client/Dockerfile
        arch:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@5579c002bb4778aa43395ef1df492868a9a1c83f # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Login to ECR
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@4625ce35226a7557230889aae2f52eb50ec3dcda # v2.0.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        # Labels only: a platform image is pushed by digest, the tags go on the index.
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ matrix.image.name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.arch.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pull requests build without pushing (no output).
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.ECR_REGISTRY, matrix.image.name) || '' }}
          cache-from: type=gha,scope=${{ matrix.image.short }}-${{ matrix.arch.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.short }}-${{ matrix.arch.suffix }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: digests-${{ matrix.image.short }}-${{ matrix.arch.suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          # Kept for "Re-run failed jobs" of a failed publish, which reuses them; a full re-run
          # rebuilds with new digests and is refused once sha-<short> exists.
          retention-days: 14

      # One SBOM per platform image: an SBOM describes the packages of one concrete image, and
      # the scanner resolves an index to a single platform.
      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@251a468eed47e5082b105c3ba6ee500c0e65a764 # v0.17.6
        env:
          # The SBOM names the image by this name, not by its registry reference; the action's
          # own artifact is off, the next step uploads the file.
          SYFT_SOURCE_NAME: ${{ matrix.image.name }}
        with:
          image: ${{ env.ECR_REGISTRY }}/${{ matrix.image.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: ${{ matrix.image.short }}-sbom-${{ matrix.arch.suffix }}.spdx.json
          upload-artifact: false
          output-file: ${{ matrix.image.short }}-sbom-${{ matrix.arch.suffix }}.spdx.json

      - name: Upload SBOM artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.image.short }}-sbom-${{ matrix.arch.suffix }}
          path: ${{ matrix.image.short }}-sbom-${{ matrix.arch.suffix }}.spdx.json

  # Runs only when every platform image of every image was built and pushed (`needs` waits for the
  # whole build matrix and is skipped if any leg failed): it creates the sha-<short> tag on the
  # multi-platform index, then signs and attests the index and each platform image
  # (scripts/sign-image.sh, re-run safe). A failed platform build leaves no tag behind.
  publish:
    name: Publish, sign & attest ${{ matrix.image.name }}
    runs-on: ubuntu-24.04
    needs: [test, build]
    if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: ohttp-gateway
            short: gateway
          - name: ohttp-relay-simulator
            short: relay-simulator
          - name: ohttp-e2e
            short: e2e

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download platform digests
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image.short }}-*
          merge-multiple: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@5579c002bb4778aa43395ef1df492868a9a1c83f # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@4625ce35226a7557230889aae2f52eb50ec3dcda # v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      # Tags are immutable: a main build tags sha-<short> only; a release tag later adds its
      # version to the same digest (promote job). Re-run safe: an existing sha-<short> is kept
      # only if it is the index of this run's platform images (scripts/publish-index.sh).
      - name: Create the multi-platform index
        id: index
        env:
          IMAGE: ${{ matrix.image.name }}
        run: |
          bash scripts/publish-index.sh --registry "$ECR_REGISTRY" --image "$IMAGE" \
            --commit "$GITHUB_SHA" --digests-dir "${RUNNER_TEMP}/digests" --output "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0

      # The index digest is the digest a deployment pins; its platform images are signed and
      # attested too, for a verifier that resolves the index to one platform first. A digest
      # that already carries the main build's signature (attestation) of this commit is not
      # signed (attested) again: a re-run of a failed publish completes without rewriting a
      # signature tag, which the registry's immutable tags would refuse.
      - name: Sign and attest the index and its platform images
        env:
          IMAGE: ${{ matrix.image.name }}
          DIGEST: ${{ steps.index.outputs.digest }}
          STARTED_ON: ${{ needs.test.outputs.started }}
        run: |
          bash scripts/sign-image.sh --registry "$ECR_REGISTRY" --image "$IMAGE" --digest "$DIGEST" \
            --workflow ohttp-build.yml --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --commit "$GITHUB_SHA" --workflow-sha "$GITHUB_SHA" --started-on "$STARTED_ON"

  # Release tag push, first job: refuses a tag that is not vMAJOR.MINOR.PATCH[-PRERELEASE], is not
  # an annotated tag signed by a key of .github/release-signing-keys.asc (on main), whose commit
  # is not on main, or whose version differs from the gateway and relay-simulator crate versions
  # and lock entries. Nothing is pushed when it fails. A consistency check: the security boundary
  # is the tag ruleset (only admins create release tags). A tag on a revision older than this
  # job runs that revision's workflow instead.
  release-check:
    name: Release tag check
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The whole history: the ancestry check walks main back to the tagged commit.
          fetch-depth: 0
          persist-credentials: false

      # The checkout keeps no credentials: the token reaches only this one git fetch, as a
      # header of that invocation (masked, never echoed). The tag is fetched again by name so
      # that the annotated tag object (and its signature) is the one of the remote.
      - name: Check the tag
        id: check
        env:
          TAG: ${{ github.ref_name }}
          FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main "+refs/tags/${TAG}:refs/tags/${TAG}"
          unset auth FETCH_TOKEN
          bash scripts/promote-image.sh check-tag --tag "$TAG" --commit "$GITHUB_SHA" \
            --main-ref origin/main --keys-file .github/release-signing-keys.asc >> "$GITHUB_OUTPUT"

  # Release tag push: promotes the sha-<short> index of the tagged commit (pushed, signed and
  # attested by its main build) of every image to the version tag, without a rebuild. One job:
  # all three images pass the preflight (scripts/promote-image.sh) before any tag is written.
  # Nothing is signed or attested: the digests keep the main build's signature and attestation.
  # If a tag write fails, re-run the job (already written tags with the same digest are
  # accepted). (id-token: the push role only.)
  promote:
    name: Promote images
    runs-on: ubuntu-24.04
    needs: release-check
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@5579c002bb4778aa43395ef1df492868a9a1c83f # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@4625ce35226a7557230889aae2f52eb50ec3dcda # v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      # cosign only verifies the main build's signature and attestation.
      - name: Install cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0

      - name: Promote sha-<short> to the version
        env:
          VERSION: ${{ needs.release-check.outputs.version }}
        run: |
          bash scripts/promote-image.sh promote --registry "$ECR_REGISTRY" \
            --commit "$GITHUB_SHA" --version "$VERSION" --repository "$GITHUB_REPOSITORY"
