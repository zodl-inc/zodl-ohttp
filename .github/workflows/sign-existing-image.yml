name: Sign Existing Image

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image name (ohttp-gateway, ohttp-relay-simulator or ohttp-e2e)'
        required: true
        type: choice
        options:
          - ohttp-gateway
          - ohttp-relay-simulator
          - ohttp-e2e
      digest:
        description: 'Image digest (sha256:...)'
        required: true
        type: string

env:
  # Repository secrets, so that the registry, the push role and the region stay out of the logs.
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

permissions:
  id-token: write
  contents: read

jobs:
  sign:
    name: Sign Image
    # A dispatch from any other branch runs nothing: no credentials, no writes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    # Inputs reach the scripts only through env (never as expressions inside run:) and are validated
    # before any other step uses them.
    env:
      IMAGE: ${{ inputs.image }}
      DIGEST: ${{ inputs.digest }}

    steps:
      - name: Validate inputs
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Error: run this workflow from main (got $GITHUB_REF)"
            exit 1
          fi
          case "$IMAGE" in
            ohttp-gateway|ohttp-relay-simulator|ohttp-e2e) ;;
            *)
              echo "Error: invalid image. Expected ohttp-gateway, ohttp-relay-simulator or ohttp-e2e"
              exit 1
              ;;
          esac
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Error: Invalid digest format. Expected sha256:<64-hex-chars>"
            exit 1
          fi
          # A registry host, optionally with a path prefix for the repositories.
          if [[ ! "$ECR_REGISTRY" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?(/[a-z0-9._-]+)*$ ]]; then
            echo "Error: ECR_REGISTRY is not a registry name"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@5579c002bb4778aa43395ef1df492868a9a1c83f # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@4625ce35226a7557230889aae2f52eb50ec3dcda # v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Install cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0

      # scripts/sign-image.sh fails if the digest does not exist, takes the source commit from
      # the image's org.opencontainers.image.revision label (every platform image of an index
      # must agree), signs and attests the digest and each platform image under this workflow's
      # identity (derived from the repository the workflow runs in), skips a digest that already
      # carries this workflow's signature (attestation), and verifies both. The predicate has no
      # buildStartedOn: the build time of an existing image is not known here.
      # Existing artifacts must be absent or already verify under this workflow and the expected
      # image/commit policy: the registry's tags are immutable, so foreign or incompatible
      # signatures or attestations (another workflow's, an older format) cannot be replaced. To
      # backfill the platform images of an index that is already signed, give each platform
      # digest directly.
      - name: Sign, attest and verify
        run: |
          bash scripts/sign-image.sh --registry "$ECR_REGISTRY" --image "$IMAGE" --digest "$DIGEST" \
            --workflow sign-existing-image.yml --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
