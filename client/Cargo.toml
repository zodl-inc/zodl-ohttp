[package]
name = "zodl-ohttp-client"
version = "2.0.2"
license = "AGPL-3.0-only"
edition = "2021"
# reqwest's dependency tree (url, idna, icu) needs 1.88.
rust-version = "1.88"
description = "Oblivious HTTP (RFC 9458) client for the ZODL gateway"
repository = "https://github.com/zodl-inc/zodl-ohttp"
documentation = "https://docs.rs/zodl-ohttp-client"
readme = "README.md"
keywords = ["ohttp", "rfc9458", "privacy", "zcash", "hpke"]
categories = ["cryptography", "network-programming"]
# The tests that run against the gateway's own code need the repository around the crate (the
# path-only dev-dependency `ohttp-gateway`, stripped on publishing, and `../docs`): they run in
# the repository's CI and are not shipped, so that `cargo test` passes on the published crate.
exclude = [
    "tests/chunked.rs",
    "tests/gateway.rs",
    "tests/gateway_core.rs",
    "tests/workspace.rs",
]

[lib]
name = "zodl_ohttp_client"

[dependencies]
# The gateway's suite, on the gateway's releases: DHKEM(X25519, HKDF-SHA256), HKDF-SHA256,
# AES-128-GCM. Held at hpke 0.13 / sha2 0.10: wallets link this next to librustzcash, whose
# RustCrypto pre-release pins do not resolve with hpke 0.14 / sha2 0.11.
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
# The RNG hpke 0.13 takes.
rand_core = { version = "0.9", features = ["os_rng"] }
zeroize = "1.7"
# The signed key-configuration envelope (/ohttp-configs/signed).
ed25519-dalek = "2"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `Client`: fetching key configurations and posting to the relay.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
# Telling a TLS failure apart in `HttpError` (the rustls reqwest uses; no provider of its own).
rustls = { version = "0.23", default-features = false, optional = true }
# URL parsing: the checks of `Client`'s URLs and of the relay URL.
url = "2.5"

[features]
default = ["client"]
## `Client`, over reqwest. Without it the crate is the encapsulation alone, for callers
## that do their own I/O.
client = ["dep:reqwest", "dep:rustls"]
## `KeyConfigSource::Plain`, an unsigned key configuration, for tests against a local gateway
## (`Client::insecure_for_local_testing` only). Never enable it in a wallet build.
insecure-plain-key-config = ["client"]

[[test]]
name = "gateway"
required-features = ["client", "insecure-plain-key-config"]

[dev-dependencies]
# The gateway's own decapsulation and key configuration, so the tests check this client
# against the server it talks to.
ohttp-gateway = { path = "../gateway" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "test-util", "io-util"] }
# A local TLS server for the `Client` tests, on the ring provider reqwest uses (rustls itself
# is a dependency of the feature `client`), with a root and leaf generated at test time by
# rcgen (no key material is shipped).
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false }
# Driving the gateway's streaming encoder in the chunked round-trip tests (its frame stream
# items are `anyhow::Result<UpFrame>`).
futures-util = "0.3"
bytes = "1"
anyhow = "1"
